apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy-conf
data:
  default.conf: |
    server {
      listen {{ .Values.containerPort }};

      location / {
        proxy_pass http://{{ required "backendHostname is required: the backend chart's internal NLB hostname, pass it via --set backendHostname=<hostname>" .Values.backendHostname }}:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
